name = "uno-game-server"
main = "src/index.ts"
compatibility_date = "2026-04-28"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDO"]

# Per-IP ceilings, keyed on CF-Connecting-IP. Generous on purpose: mobile
# carriers put many players behind one IP (CGNAT). They exist to stop one
# script from minting rooms or hammering joins, not to pace real players.
# namespace_id only has to be unique within the Cloudflare account.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Supabase project used for token introspection. This is the publishable key:
# public by design (it ships in every frontend bundle), and not a secret.
#
# It replaced the legacy `anon` JWT so the legacy key could be disabled. A
# frozen copy of the frontend was running on someone else's domain against this
# project, and its bundle carries the old key. Unlike the legacy key, this one
# rotates without touching the JWT secret, so a future lockout costs nobody
# their session.
#
# DEPLOY THIS WORKER BEFORE DISABLING THE LEGACY KEY. Introspection fails
# closed: a 401 here means verifySupabaseToken returns null and nobody can
# create or join a room.
# RealtimeKit: account id + preset name are not secrets; the app id and API
# token are wrangler secrets (REALTIMEKIT_APP_ID, REALTIMEKIT_API_TOKEN) —
# without them /health reports voice:false and voice-join answers
# voice-unavailable.
[vars]
SUPABASE_URL = "https://djzqoccutacfueuadflw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_YcRHugf7xAe9xGCquvAxyQ_85sBcPsi"
REALTIMEKIT_ACCOUNT_ID = "1d8c38c6c9efdd5a2d4bf620eb058f9d"
REALTIMEKIT_PRESET = "group_call_participant"
REALTIMEKIT_HOST_PRESET = "group_call_host"
