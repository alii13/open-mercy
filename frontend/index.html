    <!-- Structured Data: FAQPage (must match the visible FAQ in LandingFAQ.vue) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Can I play Open Mercy online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Open Mercy runs directly in your web browser at open-mercy.com. There is nothing to install - open the page and play."
          }
        },
        {
          "@type": "Question",
          "name": "Is the game free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, it is completely free to play. No purchase is required to play a full game."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to download anything?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It is a browser game that works on any modern desktop or mobile browser. No app or download is needed."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No account is required to play. You can jump in as a guest. Creating a free account is optional and only used to save your stats."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play with friends?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Create a multiplayer room, share the room code or invite link, and your friends join the same game in real time."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play against AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can start a single-player game against AI opponents whenever you don't have other players."
          }
        },
        {
          "@type": "Question",
          "name": "How many players are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each game supports 2 to 20 players."
          }
        },
        {
          "@type": "Question",
          "name": "Does the game work on mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. It works on iPhone, Android, and desktop browsers, with a layout built for touch screens."
          }
        },
        {
          "@type": "Question",
          "name": "Does the game include Draw 6 and Draw 10?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Both Draw 6 and Draw 10 cards are included, along with the other brutal action cards."
          }
        },
        {
          "@type": "Question",
          "name": "Is stacking supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Draw cards stack onto each other, so a Draw 2 can build into a much larger penalty before someone finally picks up."
          }
        },
        {
          "@type": "Question",
          "name": "What is the 25-card Mercy Rule?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If a player's hand ever reaches 25 or more cards, that player is eliminated from the game. It is the \"no mercy\" twist that ends runaway hands."
          }
        },
        {
          "@type": "Question",
          "name": "Is Open Mercy an official UNO or Mattel game?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Open Mercy is an independent game. Its ruleset was popularized by Mattel's UNO Show 'Em No Mercy® card game, but this project is not affiliated with, endorsed by, or associated with Mattel or the official UNO brand."
          }
        }
      ]
    }
    </script>

      var GA_ENABLED = GA_HOSTS.indexOf(location.hostname) !== -1;
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (GA_ENABLED) {
        var gaLoader = document.createElement('script');
        gaLoader.async = true;
        gaLoader.src = 'https://www.googletagmanager.com/gtag/js?id=G-HF9GCTVQ7J';
        document.head.appendChild(gaLoader);
        gtag('js', new Date());
        gtag('config', 'G-HF9GCTVQ7J');
        gtag('config', 'AW-18192424425');
      }

      // Google Ads conversion tracking on click
      window.gtag_report_conversion = function(url) {
        var callback = function () {
          if (typeof(url) != 'undefined') {
            window.location = url;
          }
        };
        if (!GA_ENABLED) { callback(); return false; }
        gtag('event', 'conversion', {
          'send_to': 'AW-18192424425/-S5SCMTPnbQcEOm76eJD',
          'value': 1.0,
          'currency': 'INR',
          'event_callback': callback
        });
        return false;
      };
    </script>

    <style>
      /* Boot loading state. Visually identical to App.vue's .loading-screen
         so the Vue handoff is imperceptible — no FOUC, no SEO-content flash.
         Crawler signal is carried by the h1 text, meta tags, and json-ld. */
      html, body { background: #0a0a0b; margin: 0; padding: 0; }
      body {
        background-image:
          repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 8px),
          radial-gradient(circle at center, #18191b, #0a0a0b);
        color: #e6e6e6;
        font-family: 'Chakra Petch', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
      }
      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        margin: 0;
      }
      .boot-uno {
        font-family: 'Black Ops One', 'Impact', 'Arial Black', sans-serif;
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        letter-spacing: 0.05em;
        color: #e6e6e6;
        line-height: 1;
      }
      .boot-nomercy {
        font-family: 'Black Ops One', 'Impact', 'Arial Black', sans-serif;
        font-size: clamp(0.875rem, 3vw, 1.25rem);
        letter-spacing: 0.3em;
        color: #ff2a2a;
        text-shadow: 0 0 12px rgba(255, 42, 42, 0.5);
        line-height: 1;
      }
      .boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff2a2a;
        box-shadow: 0 0 16px #ff2a2a;
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(1.6); opacity: 1; }
      }
      .boot-text {
        font-family: 'Chakra Petch', monospace;
        font-size: 0.75rem;
        color: #71717a;
        letter-spacing: 0.4em;
        margin: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dot { animation: none; opacity: 0.8; }
      }
      /* Crawler-visible SEO content, hidden from sighted users. Kept for
         old crawlers that don't run JS; modern Googlebot reads Vue output. */
      .visually-hidden {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Boot state. Visually matches App.vue .loading-screen so the Vue
           swap-in is imperceptible. Replaced once Vue mounts. -->
      <div class="boot" role="status" aria-label="Loading">
        <h1 class="boot-brand">
          <span class="boot-uno">OPEN</span>
          <span class="boot-nomercy">MERCY</span>
        </h1>
        <div class="boot-dot" aria-hidden="true"></div>
        <p class="boot-text">INITIALIZING</p>
        <p class="visually-hidden">
          Play Open Mercy free in your browser - the ruthless stacking card
          game. Real-time multiplayer (2-20 players) or solo vs AI. Draw 6,
          Draw 10, Skip Everyone, Color Roulette, hand swap on 7, rotate on 0,
          and mercy elimination at 25 cards.
        </p>
      </div>
    </div>

        <p>Read the <a href="/rules/" style="color: #00f3ff;">rules guide</a> instead.</p>

    <script type="module" src="/src/main.ts"></script>
